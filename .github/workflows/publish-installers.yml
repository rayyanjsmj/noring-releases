name: Publish verified desktop installers
on:
  workflow_dispatch:
    inputs:
      transfer:
        description: Verified temporary installer artifact references
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-installer-transfer
  cancel-in-progress: false
jobs:
  verify-windows-installation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify Student installs machine enrollment and startup for domain users
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          try {
            $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $spec = $event.inputs.transfer | ConvertFrom-Json
            $item = @($spec.artifacts | Where-Object target -EQ 'win-student')
            if ($item.Count -ne 1) { throw 'Invalid target' }
            $uri = [Uri]$item[0].url
            if ($uri.Scheme -ne 'https' -or -not $uri.Host.EndsWith('.blob.core.windows.net')) { throw 'Invalid download origin' }
            Write-Output "::add-mask::$uri"
            $folder = Join-Path $env:RUNNER_TEMP 'noring-student-install-check'
            New-Item $folder -ItemType Directory | Out-Null
            $zip = Join-Path $folder 'installer.zip'
            Invoke-WebRequest -Uri $uri -OutFile $zip
            if ('sha256:' + (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $item[0].digest) { throw 'Archive checksum mismatch' }
            Expand-Archive $zip -DestinationPath $folder
            $manifest = Get-Content (Join-Path $folder 'manifest.json') -Raw | ConvertFrom-Json
            if ($manifest.version -ne $spec.version -or $manifest.commit -ne $spec.commit -or $manifest.role -ne 'display' -or $manifest.platform -ne 'win32') { throw 'Wrong Student package' }
            if ([IO.Path]::GetFileName($manifest.file) -ne $manifest.file) { throw 'Invalid installer name' }
            $installer = Join-Path $folder $manifest.file
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256) { throw 'Installer checksum mismatch' }
            $process = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw 'Installer failed' }
            $shared = Join-Path $env:ProgramData 'Noring\ClassroomDisplay'
            if (-not (Test-Path $shared -PathType Container)) { throw 'Machine enrollment folder missing' }
            $users = @((Get-Acl $shared).Access | Where-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq 'S-1-5-32-545' -and $_.AccessControlType -eq 'Allow' -and ($_.FileSystemRights -band [System.Security.AccessControl.FileSystemRights]::Modify) -eq [System.Security.AccessControl.FileSystemRights]::Modify })
            if ($users.Count -eq 0) { throw 'Domain-user enrollment access missing' }
            $shortcutPath = Join-Path ([Environment]::GetFolderPath('CommonStartup')) 'Noring Classroom.lnk'
            if (-not (Test-Path $shortcutPath)) { throw 'Machine Startup shortcut missing' }
            $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcutPath)
            if ($shortcut.Arguments -ne '--role=display --background' -or -not (Test-Path $shortcut.TargetPath)) { throw 'Machine Startup target is invalid' }
            Write-Output 'Windows Student silent installation, shared-folder permissions, and all-user startup verified.'
          } catch {
            Write-Error 'Windows Student installer verification failed. Public publication is blocked.'
          }
  publish:
    needs: verify-windows-installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transfer and verify packages before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node publish.cjs
